<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1100" role="img" aria-labelledby="title desc"><title id="title">知行 Agent 系统架构</title><desc id="desc">Web 经 FastAPI 权限和资源治理进入 Ask、Work 与 Workflow 执行图，使用模型和工具适配、OpenSandbox、PostgreSQL、本地 Qdrant 和文件存储。DeepEval CLI 使用隔离测试目标，平台持久评测执行驱动待准入。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9cafa5"/></marker><marker id="sandboxArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#bf8664"/></marker></defs><rect width="1280" height="1100" rx="24" fill="#f8faf8"/><g font-family="'Segoe UI','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><text x="68" y="44" font-size="27" font-weight="700" fill="#243d34">系统架构</text><text x="68" y="71" font-size="16" fill="#6d7a70">代码结构概览 · 能力按模式授权 · 部署开放状态以准入与验收记录为准</text><path d="M640 184V225" fill="none" stroke="#9cafa5" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 356V394H243V424" fill="none" stroke="#9cafa5" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 394V424" fill="none" stroke="#9cafa5" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 394H1037V424" fill="none" stroke="#9cafa5" stroke-width="2" marker-end="url(#arrow)"/><path d="M243 568V602H433V634" fill="none" stroke="#9cafa5" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 568V602H433" fill="none" stroke="#9cafa5" stroke-width="2"/><path d="M1037 568V602H433" fill="none" stroke="#9cafa5" stroke-width="2"/><path d="M798 568V620H1020V634" fill="none" stroke="#bf8664" stroke-width="2" marker-end="url(#sandboxArrow)"/><path d="M1190 568V620H1020" fill="none" stroke="#bf8664" stroke-width="2"/><path d="M433 768V800H243V830" fill="none" stroke="#9cafa5" stroke-width="2" marker-end="url(#arrow)"/><path d="M433 800H640V830" fill="none" stroke="#9cafa5" stroke-width="2" marker-end="url(#arrow)"/><path d="M1020 768V800H1037V830" fill="none" stroke="#9cafa5" stroke-width="2" marker-end="url(#arrow)"/><rect x="68" y="94" width="1144" height="90" rx="16" fill="#ffffff" stroke="#d4e0d7"/><text x="92" y="128" font-size="21" font-weight="650" fill="#29473a">中文 Web · Next.js / React / Agent Chat UI</text><text x="92" y="159" font-size="16" fill="#617365">智能对话 · 任务工作台 · 工作流画布 · 资源管理 · 模型设置 · 用量与审计</text><rect x="68" y="232" width="1144" height="124" rx="16" fill="#f1f5ed" stroke="#d4e0d7"/><text x="92" y="266" font-size="21" font-weight="650" fill="#29473a">平台 API · FastAPI</text><text x="92" y="297" font-size="16" fill="#617365">身份认证与 RBAC  →  资源归属与版本快照  →  运行创建与审批</text><text x="92" y="322" font-size="16" fill="#617365">模型配置与加密凭据 · 预算与租约 · 事件与 SSE · 审计与成果下载</text><rect x="68" y="430" width="350" height="138" rx="16" fill="#ffffff" stroke="#d4e0d7"/><text x="92" y="464" font-size="21" font-weight="650" fill="#29473a">Ask Runtime</text><text x="92" y="495" font-size="16" fill="#617365">LangGraph / LangChain</text><text x="92" y="520" font-size="16" fill="#617365">按模型工具能力选择 Deep Agents</text><text x="92" y="545" font-size="16" fill="#617365">对话、引用与持久检查点</text><rect x="465" y="430" width="350" height="138" rx="16" fill="#ffffff" stroke="#d4e0d7"/><text x="489" y="464" font-size="21" font-weight="650" fill="#29473a">Work Worker</text><text x="489" y="495" font-size="16" fill="#617365">Deep Agents · 持久任务队列</text><text x="489" y="520" font-size="16" fill="#617365">计划、委派、审批与故障恢复</text><text x="489" y="545" font-size="16" fill="#617365">执行权限与预算逐边界检查</text><rect x="862" y="430" width="350" height="138" rx="16" fill="#ffffff" stroke="#d4e0d7"/><text x="886" y="464" font-size="21" font-weight="650" fill="#29473a">Workflow Runtime</text><text x="886" y="495" font-size="16" fill="#617365">LangGraph DAG · 节点注册</text><text x="886" y="520" font-size="16" fill="#617365">单节点测试、版本与运行轨迹</text><text x="886" y="545" font-size="16" fill="#617365">模型 / Agent / 检索 / 工具节点</text><rect x="68" y="640" width="730" height="128" rx="16" fill="#ffffff" stroke="#d4e0d7"/><text x="92" y="674" font-size="21" font-weight="650" fill="#29473a">模型、知识与工具适配</text><text x="92" y="705" font-size="16" fill="#617365">模型服务 · 联网 · 文档解析 · Embedding / Rerank</text><text x="92" y="730" font-size="16" fill="#617365">MCP · Skills · 长期记忆 · 资源版本与授权</text><rect x="828" y="640" width="384" height="128" rx="16" fill="#fcf1eb" stroke="#e7c9b8"/><text x="852" y="674" font-size="21" font-weight="650" fill="#29473a">OpenSandbox 隔离执行</text><text x="852" y="705" font-size="16" fill="#617365">Coding / Browser 执行镜像</text><text x="852" y="730" font-size="16" fill="#617365">生命周期、路径与成果边界</text><rect x="68" y="836" width="350" height="112" rx="16" fill="#ffffff" stroke="#d4e0d7"/><text x="92" y="870" font-size="21" font-weight="650" fill="#29473a">PostgreSQL</text><text x="92" y="901" font-size="16" fill="#617365">身份、业务、用量、队列</text><text x="92" y="926" font-size="16" fill="#617365">事件与 LangGraph 检查点</text><rect x="465" y="836" width="350" height="112" rx="16" fill="#ffffff" stroke="#d4e0d7"/><text x="489" y="870" font-size="21" font-weight="650" fill="#29473a">Qdrant Local</text><text x="489" y="901" font-size="16" fill="#617365">嵌入式向量索引</text><text x="489" y="926" font-size="16" fill="#617365">当前实现使用本地 path 存储</text><rect x="862" y="836" width="350" height="112" rx="16" fill="#ffffff" stroke="#d4e0d7"/><text x="886" y="870" font-size="21" font-weight="650" fill="#29473a">文件存储</text><text x="886" y="901" font-size="16" fill="#617365">附件、资料与持久成果</text><text x="886" y="926" font-size="16" fill="#617365">平台加密主密钥单独保管</text><rect x="68" y="990" width="1144" height="80" rx="16" fill="#fdf8eb" stroke="#d6b977" stroke-dasharray="6 5"/><text x="92" y="1022" font-size="19" font-weight="600" fill="#8a682d">独立评测 · DeepEval + pytest + 受控 CLI</text><text x="92" y="1050" font-size="16" fill="#8a7650">访问隔离测试目标，使用独立数据库、账号与命名空间；平台持久批次执行驱动仍待准入。</text></g></svg>