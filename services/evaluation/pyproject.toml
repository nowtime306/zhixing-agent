[project]
name = "owner-agent-evaluation"
version = "0.1.0"
description = "Isolated evaluation runner for Zhixing Agent"
authors = [{ name = "nowtime" }]
requires-python = ">=3.12,<3.13"
dependencies = ["deepeval==4.3.2", "httpx>=0.28,<0.29", "pydantic>=2.11.7,<3", "portalocker>=3,<5"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluation_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
